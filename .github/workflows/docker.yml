# Build and push the pinned NanoGen image.
#
# Runs only when the Docker build context changes. The pipeline references the
# image by digest (params.container in nextflow.config), so a new image takes
# effect only once a PR bumps that digest.

name: docker

on:
  push:
    paths:
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dimadatascience/nanogen

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ${IMAGE}@${DIGEST}"
          {
            echo "## NanoGen image"
            echo
            echo "Set \`params.container\` in \`nextflow.config\` (and its default in \`nextflow_schema.json\`) to:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
